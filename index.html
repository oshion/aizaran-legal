<title>아이자란</title>
<style>
:root{--bg:#fff;--fg:#1f2328;--muted:#57606a;--line:#d0d7de;--accent:#0969da}
@media(prefers-color-scheme:dark){:root{--bg:#0d1117;--fg:#e6edf3;--muted:#9198a1;--line:#30363d;--accent:#4493f8}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Roboto,"Malgun Gothic",sans-serif;line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;-webkit-text-size-adjust:100%}
.wrap{max-width:520px;padding:40px 24px;width:100%}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--muted);font-size:15px;margin:0 0 28px}
ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
a.card{display:block;padding:16px 18px;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--fg);font-size:16px;font-weight:600}
a.card:hover{border-color:var(--accent);color:var(--accent)}
footer{margin-top:32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>

  <footer>&copy; 아이자란</footer>
</div>

</html>
